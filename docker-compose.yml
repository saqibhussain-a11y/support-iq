services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: supportiq-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supportiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supportiq}
      POSTGRES_DB: ${POSTGRES_DB:-supportiq}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supportiq}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
